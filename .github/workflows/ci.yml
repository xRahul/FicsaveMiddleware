name: CI
on:
  push: { branches: [master] }
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/

  debug-apk-release:
    if: github.event_name != 'pull_request'
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reports-apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: master-debug
          name: Latest master build (debug)
          body: Debug APK from the latest master push. Updated automatically.
          files: '**/app-debug.apk'
          make_latest: true
