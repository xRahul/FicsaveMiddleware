name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build unsigned APK
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ''
          SIGNING_STORE_PASSWORD: ''
          SIGNING_KEY_ALIAS: ''
          SIGNING_KEY_PASSWORD: ''

      - name: Warn about missing signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Signing secrets are not configured - APK was built UNSIGNED and was NOT uploaded to the release."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Release asset skipped
          Signing secrets (`KEYSTORE_BASE64`, `SIGNING_STORE_PASSWORD`, `SIGNING_KEY_ALIAS`, `SIGNING_KEY_PASSWORD`) are not configured, so the APK was built unsigned and **not uploaded**.
          Configure the secrets and re-run to publish a signed APK.
          EOF

      - name: Build signed APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: app/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload to GitHub Release
        if: env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
