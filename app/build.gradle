apply plugin: 'com.android.application'

android {
  namespace 'in.rahulja.fichubmiddleware'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId rootProject.ext.applicationId
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    versionCode rootProject.ext.versionCode
    versionName rootProject.ext.versionName
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    resourceConfigurations += ["en"]
  }
  signingConfigs {
    release {
      if (System.getenv('KEYSTORE_FILE')) {
        storeFile rootProject.file(System.getenv('KEYSTORE_FILE'))
        storePassword System.getenv('SIGNING_STORE_PASSWORD')
        keyAlias System.getenv('SIGNING_KEY_ALIAS')
        keyPassword System.getenv('SIGNING_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    debug {
      shrinkResources false
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      shrinkResources true
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (System.getenv('KEYSTORE_FILE')) {
        signingConfig signingConfigs.release
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  buildFeatures {
    buildConfig true
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  constraints {
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.10') {
      because 'merged into kotlin-stdlib since 1.8'
    }
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.10') {
      because 'merged into kotlin-stdlib since 1.8'
    }
  }

  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'androidx.preference:preference:1.2.1'
  implementation 'androidx.cardview:cardview:1.0.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'

  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  // AndroidJUnitRunner and JUnit Rules
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.6.1'
  // Espresso dependencies
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
